[workspace]
members = ["ramdisk", "ramdisk-gui"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Unlicense"
rust-version = "1.85"

# Force a single cxx ABI across the workspace (including cxx-qt-build → cxx-gen)
[workspace.dependencies]
cxx = "=1.0.186"
cxx-gen = "=0.7.186"
