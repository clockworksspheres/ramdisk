[package]
name = "ramdisk-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CXX-Qt / QML GUI for ramdisk"

[[bin]]
name = "ramdisk-gui"
path = "src/main.rs"

[dependencies]
ramdisk = { path = "../ramdisk", default-features = false }
# Must match the cxxbridge symbol ABI used by cxx-qt-build's cxx-gen.
# A mismatch produces undefined refs like ramdisk_gui$cxxbridge1$203$...
cxx = { version = "=1.0.186" }
cxx-qt = { version = "=0.7.3" }
cxx-qt-lib = { version = "=0.7.3", default-features = false, features = [
    "qt_full",
    "link_qt_object_files",
] }

[build-dependencies]
cxx-qt-build = { version = "=0.7.3", features = ["link_qt_object_files"] }
# Pin the code generator that emits C++ cxxbridge symbol names
cxx-gen = { version = "=0.7.186" }
cxx = { version = "=1.0.186" }

[package.metadata.cargo-udeps.ignore]
build = ["cxx", "cxx-gen"]
