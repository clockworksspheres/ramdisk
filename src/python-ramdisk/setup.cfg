[metadata]
name = ramdisk
version = 0.1.1
description = library for creating and managing ramdisks, same interface, on Linux, macOS and Windows

[options]
packages = ramdisk
include_package_data = True
python_requires =>3.10
install_requires =
    astroid
    pytest
    pylint
    packaging
    psutil
    requests
    pywin32; sys_platform == 'win32'
    wmi; sys_platform == 'win32'
